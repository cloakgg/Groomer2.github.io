    <style>
        body {

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- Utils ---
        const cn = (...classes) => classes.filter(Boolean).join(' ');

        // --- Icons Proxy ---
        const LucideIcon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                const icon = lucide.icons[name];
                if (icon) {
                    const svg = icon.toSvg({
                        width: size,
                        height: size,
                        class: className,
                        'stroke-width': 2
                    });
                    iconRef.current.innerHTML = svg;
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        // --- Shaders ---
        function WebGLShader() {
            const canvasRef = useRef(null);
            useEffect(() => {
                if (!canvasRef.current) return;
                const canvas = canvasRef.current;
                
                const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
                renderer.setPixelRatio(window.devicePixelRatio);
                renderer.setSize(window.innerWidth, window.innerHeight);
                
                const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, -1);
                const scene = new THREE.Scene();
                
                const uniforms = {
                    resolution: { value: [window.innerWidth, window.innerHeight] },
                    time: { value: 0.0 },
                    xScale: { value: 1.0 },
                    yScale: { value: 0.5 },
                    distortion: { value: 0.05 },
                };

                const vertexShader = `
                    attribute vec3 position;
                    void main() { gl_Position = vec4(position, 1.0); }
                `;

                const fragmentShader = `
                    precision highp float;
                    uniform vec2 resolution;
                    uniform float time;
                    uniform float xScale;
                    uniform float yScale;
                    uniform float distortion;

                    void main() {
                        vec2 p = (gl_FragCoord.xy * 2.0 - resolution) / min(resolution.x, resolution.y);
                        float d = length(p) * distortion;
                        float rx = p.x * (1.0 + d);
                        float gx = p.x;
                        float bx = p.x * (1.0 - d);

                        float r = 0.05 / abs(p.y + sin((rx + time) * xScale) * yScale);
                        float g = 0.05 / abs(p.y + sin((gx + time) * xScale) * yScale);
                        float b = 0.05 / abs(p.y + sin((bx + time) * xScale) * yScale);
                        gl_FragColor = vec4(r, g, b, 1.0);
                    }
                `;

                const geometry = new THREE.PlaneGeometry(2, 2);
                const material = new THREE.RawShaderMaterial({
                    vertexShader,
                    fragmentShader,
                    uniforms,
                    transparent: true
                });

                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                let animationId;
                const animate = () => {
                    uniforms.time.value += 0.01;
                    renderer.render(scene, camera);
                    animationId = requestAnimationFrame(animate);
                };

                const handleResize = () => {
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    uniforms.resolution.value = [window.innerWidth, window.innerHeight];
                };

                window.addEventListener('resize', handleResize);
                animate();

                return () => {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('resize', handleResize);
                    renderer.dispose();
                };
            }, []);

            return <canvas ref={canvasRef} className="absolute top-0 left-0 w-full h-full block pointer-events-none opacity-30" />;
        }

        function NebulaShader() {
            const canvasRef = useRef(null);
            useEffect(() => {
                if (!canvasRef.current) return;
                const canvas = canvasRef.current;
                const gl = canvas.getContext('webgl2');
                if (!gl) return;

                const shaderSource = `#version 300 es
                    precision highp float;
                    out vec4 O;
                    uniform vec2 resolution;
                    uniform float time;
                    #define FC gl_FragCoord.xy
                    #define T time
                    #define R resolution
                    #define MN min(R.x,R.y)

                    float rnd(vec2 p) {
                        p=fract(p*vec2(12.9898,78.233));
                        p+=dot(p,p+34.56);
                        return fract(p.x*p.y);
                    }

                    float noise(in vec2 p) {
                        vec2 i=floor(p), f=fract(p), u=f*f*(3.-2.*f);
                        float a=rnd(i), b=rnd(i+vec2(1,0)), c=rnd(i+vec2(0,1)), d=rnd(i+1.0);
                        return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);
                    }

                    float fbm(vec2 p) {
                        float t=.0, a=1.; mat2 m=mat2(1.,-.5,.2,1.2);
                        for (int i=0; i<5; i++) {
                            t+=a*noise(p);
                            p*=2.*m;
                            a*=.5;
                        }
                        return t;
                    }

                    float clouds(vec2 p) {
                        float d=1., t=.0;
                        for (float i=.0; i<3.; i++) {
                            float a=d*fbm(i*10.+p.x*.2+.2*(1.+i)*p.y+d+i*i+p);
                            t=mix(t,d,a);
                            d=a;
                            p*=2./(i+1.);
                        }
                        return t;
                    }

                    void main() {
                        vec2 uv=(FC-.5*R)/MN, st=uv*vec2(2,1);
                        vec3 col=vec3(0);
                        float bg=clouds(vec2(st.x+T*.1,-st.y));
                        uv*=1.-.3*(sin(T*.1)*.5+.5);
                        for (float i=1.; i<8.; i++) {
                            uv+=.1*cos(i*vec2(.1+.01*i, .8)+i*i+T*.2+.1*uv.x);
                            vec2 p=uv;
                            float d=length(p);
                            col+=.00125/d*(cos(sin(i)*vec3(1,2,3))+1.);
                            float b=noise(i+p+bg*1.731);
                            col+=.002*b/length(max(p,vec2(b*p.x*.02,p.y)));
                            col=mix(col,vec3(bg*.15,bg*.07,bg*.02),d);
                        }
                        O=vec4(col,1);
                    }
                `;

                const compile = (type, source) => {
                    const shader = gl.createShader(type);
                    gl.shaderSource(shader, source);
                    gl.compileShader(shader);
                    return shader;
                };

                const vs = compile(gl.VERTEX_SHADER, `#version 300 es\n precision highp float; in vec4 p; void main(){gl_Position=p;}`);
                const fs = compile(gl.FRAGMENT_SHADER, shaderSource);
                const prg = gl.createProgram();
                gl.attachShader(prg, vs);
                gl.attachShader(prg, fs);
                gl.linkProgram(prg);
                gl.useProgram(prg);

                const buff = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buff);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,1,-1,-1,1,1,1,-1]), gl.STATIC_DRAW);
                const pos = gl.getAttribLocation(prg, 'p');
                gl.enableVertexAttribArray(pos);
                gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0,0);

                const resLoc = gl.getUniformLocation(prg, 'resolution');
                const timeLoc = gl.getUniformLocation(prg, 'time');

                const resize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    gl.viewport(0,0, canvas.width, canvas.height);
                };
                window.addEventListener('resize', resize);
                resize();

                let aid;
                const render = (t) => {
                    gl.uniform2f(resLoc, canvas.width, canvas.height);
                    gl.uniform1f(timeLoc, t*0.001);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                    aid = requestAnimationFrame(render);
                };
                aid = requestAnimationFrame(render);

                return () => {
                    cancelAnimationFrame(aid);
                    window.removeEventListener('resize', resize);
                    gl.deleteProgram(prg);
                };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none opacity-50" style={{background: 'black'}} />;
        }

        // --- Dock Component ---
        const MacOSDock = ({ tabs, onTabClick, activeTab, className }) => {
            const [mouseX, setMouseX] = useState(null);
            const dockRef = useRef(null);
            
            const handleMouseMove = (e) => {
                const rect = dockRef.current.getBoundingClientRect();
                setMouseX(e.clientX - rect.left - 12);
            };

            const handleMouseLeave = () => setMouseX(null);

            const baseSize = 48;
            const spacing = 12;

            return (
                <div 
                    ref={dockRef}
                    className={cn("backdrop-blur-xl flex items-center p-3 gap-3 bg-[#141414b3] border border-[#f2ca5033] shadow-2xl rounded-[24px]", className)}
                    onMouseMove={handleMouseMove}
                    onMouseLeave={handleMouseLeave}
                >
                    {tabs.map((tab) => {
                        const isActive = activeTab === tab.id;
                        return (
                            <div
                                key={tab.id}
                                onClick={() => onTabClick(tab.id)}
                                className={cn(
                                    "w-12 h-12 rounded-xl flex items-center justify-center cursor-pointer transition-all duration-300 relative group",
                                    isActive ? "bg-[#f2ca50] text-[#3c2f00] shadow-lg shadow-[#f2ca504d]" : "bg-white/5 text-[#d0c5af] hover:bg-white/10"
                                )}
                            >
                                <LucideIcon name={tab.iconName} size={28} />
                                <div className="absolute bottom-full mb-4 px-2 py-1 bg-[#201f20] rounded text-[10px] font-mono tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none border border-white/5">
                                    {tab.name}
                                </div>
                                {isActive && <div className="absolute -bottom-1.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full bg-[#f2ca50] shadow-[0_0_8px_#f2ca50]" />}
                            </div>
                        );
                    })}
                </div>
            );
        };

        // --- Search Bar ---
        const ActionSearchBar = ({ onSelect, selectedValue }) => {
            const [query, setQuery] = useState(selectedValue || "");
            const services = [
                { id: "1", label: "Signature Haircut", price: "PKR 3500", desc: "Fade/Cut" },
                { id: "2", label: "Royal Hot Towel Shave", price: "PKR 2500", desc: "Classic Razor" },
                { id: "3", label: "Beard Sculpt & Trim", price: "PKR 1500", desc: "Line Up" }
            ];

            return (
                <div className="w-full relative">
                    <div className="relative">
                        <input 
                            type="text" 
                            placeholder="Select a service..."
                            className="w-full bg-transparent border-b border-white/10 py-3 focus:outline-none focus:border-[#f2ca50] transition-all text-[#e5e2e3]"
                            value={query}
                            onChange={(e) => setQuery(e.target.value)}
                        />
                        <div className="absolute right-3 top-1/2 -translate-y-1/2 opacity-40">
                            <LucideIcon name="Search" size={16} />
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App ---
        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navigate = (id) => {
                setCurrentPage(id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const images = {
                hero: "https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&q=80&w=2000",
                cut: "https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&q=80&w=1200",
                shave: "https://images.unsplash.com/photo-1599351431247-f579338cb12d?auto=format&fit=crop&q=80&w=1200",
                tools: "https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&q=80&w=1200"
            };

            return (
                <div className="organic-mesh transition-colors duration-500">
                    <nav className={cn("fixed top-4 left-0 w-full z-50 flex justify-center transition-all duration-500", scrolled ? "translate-y-0" : "translate-y-2")}>
                        <MacOSDock 
                            tabs={[
                                { id: 'home', name: 'Home', iconName: 'Scissors' },
                                { id: 'services', name: 'Services', iconName: 'Armchair' },
                                { id: 'about', name: 'About', iconName: 'Award' },
                                { id: 'contact', name: 'Contact', iconName: 'PhoneCall' }
                            ]}
                            activeTab={currentPage}
                            onTabClick={navigate}
                            className={scrolled ? "scale-90" : "scale-100"}
                        />
                    </nav>

                    <AnimatePresence mode="wait">
                        {currentPage === 'home' && (
                            <motion.div key="home" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}}>
                                <section className="relative min-h-screen flex items-center pt-20 px-6 overflow-hidden bg-black">
                                    <div className="absolute inset-0">
                                        <img src={images.hero} className="w-full h-full object-cover opacity-50 grayscale" />
                                        <WebGLShader />
                                        <div className="absolute inset-0 bg-gradient-to-t from-[#131314] via-black/80 to-transparent" />
                                    </div>
                                    <div className="max-w-7xl mx-auto w-full relative z-10">
                                        <motion.div initial={{y:20, opacity:0}} animate={{y:0, opacity:1}} transition={{delay:0.4}}>
                                            <span className="font-mono text-xs text-[#f2ca50] font-bold tracking-[0.4em] mb-6 block uppercase">Heritage — Branch 2</span>
                                            <h1 className="font-display text-7xl md:text-9xl mb-8 leading-tight tracking-tighter">
                                                Elite <br /><span className="text-[#f2ca50] italic">Precision</span>
                                            </h1>
                                            <p className="text-lg text-[#d0c5af] mb-12 max-w-xl">Karachi's most meticulous barber studio. Real people, real techniques, and a legacy of excellence.</p>
                                            <div className="flex gap-6">
                                                <button onClick={()=>navigate('contact')} className="primary-gradient px-10 py-5 rounded-full font-bold text-[#3c2f00] shadow-2xl">Book Now</button>
                                                <button onClick={()=>navigate('services')} className="border-2 border-[#f2ca5022] text-[#f2ca50] px-10 py-5 rounded-full font-bold hover:bg-[#f2ca5011]">Services</button>
                                            </div>
                                        </motion.div>
                                    </div>
                                </section>

                                <section className="py-24 bg-black overflow-hidden relative border-y border-white/5">
                                    <div className="marquee-scroller whitespace-nowrap">
                                        {[images.cut, images.shave, images.tools, images.hero].map((img, i) => (
                                            <div key={i} className="flex-none w-[350px] h-[450px] mx-4 rounded-3xl overflow-hidden glass border-4 border-white/5 marquee-item">
                                                <img src={img} className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" />
                                            </div>
                                        ))}
                                        {[images.cut, images.shave, images.tools, images.hero].map((img, i) => (
                                            <div key={i+4} className="flex-none w-[350px] h-[450px] mx-4 rounded-3xl overflow-hidden glass border-4 border-white/5 marquee-item">
                                                <img src={img} className="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700" />
                                            </div>
                                        ))}
                                    </div>
                                </section>
                            </motion.div>
                        )}

                        {currentPage === 'services' && (
                            <motion.div key="services" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="pt-40 pb-20 px-6 bg-black min-h-screen relative">
                                <NebulaShader />
                                <div className="max-w-7xl mx-auto relative z-10">
                                    <h1 className="font-display text-7xl mb-12 italic text-center">Our <span className="text-[#f2ca50]">Menu</span></h1>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-12">
                                        {[
                                            { title: "Precision Haircut", price: "PKR 3500", desc: "Meticulous cut & straight razor neck shave", img: images.cut },
                                            { title: "Hot Towel Shave", price: "PKR 2500", desc: "Traditional luxury lather & skin ritual", img: images.shave }
                                        ].map((s, i) => (
                                            <div key={i} className="glass rounded-2xl overflow-hidden group">
                                                <div className="aspect-video overflow-hidden"><img src={s.img} className="w-full h-full object-cover grayscale transition-all duration-700 group-hover:scale-110" /></div>
                                                <div className="p-10">
                                                    <div className="flex justify-between items-center mb-6">
                                                        <h3 className="font-display text-4xl text-[#f2ca50]">{s.title}</h3>
                                                        <span className="text-[#f2ca50] font-mono text-xs border border-[#f2ca5044] px-4 py-1 rounded-full">{s.price}</span>
                                                    </div>
                                                    <p className="text-[#d0c5af] mb-8">{s.desc}</p>
                                                    <button onClick={()=>navigate('contact')} className="w-full py-4 border border-[#f2ca50] text-[#f2ca50] rounded-full font-bold uppercase tracking-widest text-xs hover:bg-[#f2ca50] hover:text-black">Book Appointment</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </motion.div>
                        )}

                        {currentPage === 'about' && (
                            <motion.div key="about" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="pt-40 pb-20 px-6 bg-black min-h-screen relative">
                                <NebulaShader />
                                <div className="max-w-7xl mx-auto relative z-10">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-20 items-center mb-32">
                                        <div>
                                            <span className="font-mono text-xs text-[#f2ca50] uppercase tracking-[0.4em] mb-4 block">Our Heritage</span>
                                            <h1 className="font-display text-7xl mb-8 italic">The Studio Story</h1>
                                            <p className="text-lg text-[#d0c5af] leading-relaxed mb-8">At Groomer Branch 2, we believe grooming is more than a service; it's a meticulous craft that merges heritage techniques with modern sophistication.</p>
                                            <div className="grid grid-cols-2 gap-6">
                                                <div className="glass p-6 rounded-xl border-[#f2ca5022]">
                                                    <span className="font-display text-4xl text-[#f2ca50] block mb-2">15+</span>
                                                    <span className="font-mono text-[10px] uppercase tracking-widest opacity-60">Years of Craft</span>
                                                </div>
                                                <div className="glass p-6 rounded-xl border-[#f2ca5022]">
                                                    <span className="font-display text-4xl text-[#f2ca50] block mb-2">10k+</span>
                                                    <span className="font-mono text-[10px] uppercase tracking-widest opacity-60">Masterpieces</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="relative group">
                                            <img src={images.hero} className="rounded-2xl h-[500px] w-full object-cover border-2 border-[#f2ca5022] grayscale group-hover:grayscale-0 transition-all duration-700" />
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        )}

                        {currentPage === 'contact' && (
                            <motion.div key="contact" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} className="pt-40 pb-20 px-6 bg-black min-h-screen relative">
                                <NebulaShader />
                                <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-20 relative z-10">
                                    <div>
                                        <h1 className="font-display text-7xl mb-12 italic leading-tight">Claim Your <span className="text-[#f2ca50]">Chair</span></h1>
                                        <div className="space-y-12">
                                            <div className="flex items-start gap-8 group">
                                                <div className="w-14 h-14 glass rounded-full flex items-center justify-center text-[#f2ca50] border-[#f2ca5033] group-hover:scale-110 transition-transform"><LucideIcon name="MapPin" /></div>
                                                <div>
                                                    <p className="font-mono text-[10px] text-[#f2ca50] mb-2 uppercase">Studio Location</p>
                                                    <p className="text-2xl font-display">Block 14, Federal B Area, Karachi</p>
                                                </div>
                                            </div>
                                            <div className="flex items-start gap-8 group">
                                                <div className="w-14 h-14 glass rounded-full flex items-center justify-center text-[#f2ca50] border-[#f2ca5033] group-hover:scale-110 transition-transform"><LucideIcon name="Clock" /></div>
                                                <div>
                                                    <p className="font-mono text-[10px] text-[#f2ca50] mb-2 uppercase">Studio Hours</p>
                                                    <p className="text-2xl font-display">Daily: 11 AM — 11 PM</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="glass p-12 rounded-2xl border-[#f2ca5022]">
                                        <form className="space-y-8" onSubmit={(e)=>{ 
                                            e.preventDefault(); 
                                            const name = e.target[0].value;
                                            const phone = e.target[1].value;
                                            const msg = encodeURIComponent(`*Groomer Booking*\nName: ${name}\nPhone: ${phone}\nRequesting session.`);
                                            window.open(`https://wa.me/923001234567?text=${msg}`);
                                        }}>
                                            <div>
                                                <label className="font-mono text-[10px] uppercase opacity-40 mb-2 block">Full Name</label>
                                                <input type="text" placeholder="Entry name" className="w-full bg-transparent border-b border-white/10 py-4 outline-none focus:border-[#f2ca50] text-[#e5e2e3]" required />
                                            </div>
                                            <div>
                                                <label className="font-mono text-[10px] uppercase opacity-40 mb-2 block">Phone Number</label>
                                                <input type="tel" placeholder="+92 ..." className="w-full bg-transparent border-b border-white/10 py-4 outline-none focus:border-[#f2ca50] text-[#e5e2e3]" required />
                                            </div>
                                            <button className="w-full primary-gradient py-6 rounded-full font-bold text-[#3c2f00] uppercase tracking-widest shadow-xl hover:scale-[1.02] transition-transform">Request Session</button>
                                        </form>
                                    </div>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    <footer className="bg-black/50 py-20 border-t border-white/5 px-6">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
                            <div className="flex items-center gap-4"><LucideIcon name="Scissors" className="text-[#f2ca50]" /><span className="font-display text-4xl italic text-[#f2ca50]">Groomer</span></div>
                            <div className="flex gap-6 opacity-60"><LucideIcon name="Instagram" /><LucideIcon name="Facebook" /><LucideIcon name="Twitter" /></div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
